name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/dashwort/healthpulse

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore HealthTracker.slnx
      - name: Build solution
        run: dotnet build HealthTracker.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test HealthTracker.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: ignore

  container:
    name: Build container
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Collect deployment metadata
        id: deployment
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build and publish container
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPLOYMENT_VERSION=${{ steps.deployment.outputs.version }}
            DEPLOYMENT_BUILD=${{ steps.deployment.outputs.build }}
            DEPLOYMENT_COMMIT=${{ steps.deployment.outputs.commit }}
            DEPLOYMENT_BUILT_AT_UTC=${{ steps.deployment.outputs.built_at_utc }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy production image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: [self-hosted, linux, x64, healthpulse-production]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy immutable image digest
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
        run: |
          set -eu
          test -n "$IMAGE_DIGEST"
          sudo /usr/local/sbin/healthpulse-deploy "$IMAGE_DIGEST"
