name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/dashwort/healthpulse

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Install pnpm
        run: npm install --global pnpm@11.24.0
      - name: Install frontend dependencies
        working-directory: src/HealthTracker.Web/ClientApp
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: src/HealthTracker.Web/ClientApp
        run: pnpm test
      - name: Build frontend
        working-directory: src/HealthTracker.Web/ClientApp
        run: pnpm build
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore HealthTracker.slnx
      - name: Build solution
        run: dotnet build HealthTracker.slnx --configuration Release --no-restore
      - name: Install Playwright browser
        shell: pwsh
        run: pwsh tests/HealthTracker.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Enforce reflection-free tests
        shell: bash
        run: |
          if rg -n 'System\.Reflection|BindingFlags|Activator\.CreateInstance' tests android --glob '*.cs' --glob '*.kt'; then
            echo "Reflection-based test access is not permitted. Use public seams instead." >&2
            exit 1
          fi
      - name: Run tests
        run: dotnet test HealthTracker.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults
          if-no-files-found: ignore

  android-test:
    name: Build and test Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4codex.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: android
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-results-${{ github.run_id }}
          path: |
            ~/.gradle/healthpulse-build/app/reports
            ~/.gradle/healthpulse-build/app/outputs/androidTest-results
          if-no-files-found: ignore

  container:
    name: Build container without publication credentials
    needs: [build-test, android-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Collect candidate metadata
        id: candidate
        shell: bash
        run: |
          set -eu
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build immutable candidate once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          tags: healthpulse-ci:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/healthpulse-image.tar
          build-args: |
            DEPLOYMENT_VERSION=${{ steps.candidate.outputs.version }}
            DEPLOYMENT_BUILT_AT_UTC=${{ steps.candidate.outputs.built_at }}
            DEPLOYMENT_COMMIT=${{ github.sha }}
            DEPLOYMENT_BUILD=${{ github.run_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: healthpulse-image-${{ github.sha }}
          path: ${{ runner.temp }}/healthpulse-image.tar
          if-no-files-found: error
          retention-days: 7

  publish-candidate:
    name: Publish tested candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: healthpulse-image-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested image without rebuilding
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          docker load --input "$RUNNER_TEMP/candidate/healthpulse-image.tar"
          docker tag "healthpulse-ci:$SOURCE_SHA" "ghcr.io/dashwort/healthpulse:sha-$SOURCE_SHA"
          docker push "ghcr.io/dashwort/healthpulse:sha-$SOURCE_SHA"

  production-admission:
    name: Production admission
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require verified deployment broker
        run: |
          echo 'Production deployment is blocked until the independently verified broker, rollback and backup gates are installed.'
          exit 1
