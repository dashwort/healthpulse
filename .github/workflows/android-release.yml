name: Android release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Three-part Android version (for example, 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Determine Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${RELEASE_TAG#android-v}"
          else
            VERSION="${{ inputs.version }}"
            RELEASE_TAG="android-v${VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the form major.minor.patch." >&2
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION}"
          VERSION_CODE=$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "Derived Android version code is outside the supported range." >&2
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Validate Android project
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/healthpulse-release.jks"
          chmod 600 "${RUNNER_TEMP}/healthpulse-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/healthpulse-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PhealthPulseVersionName="${{ steps.version.outputs.name }}" \
            -PhealthPulseVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="${HOME}/.gradle/healthpulse-build/app/outputs/apk/release/app-release.apk"
          APK_NAME="HealthPulse-${{ steps.version.outputs.name }}.apk"
          test -f "${APK_SOURCE}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose "${APK_SOURCE}"
          cp "${APK_SOURCE}" "${RUNNER_TEMP}/${APK_NAME}"
          echo "path=${RUNNER_TEMP}/${APK_NAME}" >> "${GITHUB_OUTPUT}"
          echo "name=${APK_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: HealthPulse Android ${{ steps.version.outputs.name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${APK_PATH}#${APK_NAME}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${APK_PATH}#${APK_NAME}" \
              --title "${RELEASE_NAME}" \
              --generate-notes
          fi
